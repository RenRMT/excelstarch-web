<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ROOS Kleurenkiezer</title>

<style>
    body {
        font-family: Verdana, Geneva, sans-serif;
        background: #F1F5F9;
        color: #1E293B;
        margin: 24px;
    }

    h1 {
        font-size: 24px;
        margin: 0 0 8px 0;
        color: #154273;
    }

    h2 {
        font-size: 16px;
        margin-top: 40px;
        border-top: 2px solid #007BC7;
        padding-top: 16px;
    }

    h3 {
        font-size: 12px;
        font-weight: 700;
        color: #475569;
        margin: 24px 0 8px 0;
    }

    .subtitle {
        color: #475569;
        font-size: 14px;
        max-width: 84ch;
        line-height: 1.6;
    }

    .palette-section {
        margin-bottom: 32px;
    }

    .palette-group {
        margin-bottom: 20px;
    }

    .palette {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 12px;
        width: 100%;
    }

    /* Ramps: one row per colour, six tints, so the trap is readable as a trap */
    .palette.ramp {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
        max-width: 880px;
    }

    .color-box {
        --box-color: #000;
        background: var(--box-color);
        height: 104px;
        border-radius: 3px;
        border: 1px solid #CBD5E1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        position: relative;
        cursor: pointer;
        padding: 0;
        text-align: left;
        font: inherit;
    }

    .color-box:hover {
        outline: 2px solid #007BC7;
        outline-offset: 2px;
    }

    .caption {
        font-size: 10px;
        line-height: 1.4;
        padding: 6px;
        border-radius: 0 0 2px 2px;
    }

    .caption strong {
        display: block;
        font-size: 11px;
    }

    .copied {
        position: absolute;
        top: 6px;
        right: 6px;
        background: #154273;
        color: #FFFFFF;
        padding: 3px 6px;
        border-radius: 3px;
        font-size: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s;
    }

    .copied.visible {
        opacity: 1;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 8px 0 16px 0;
        font-size: 12px;
    }

    .controls label {
        font-weight: 700;
        color: #475569;
    }

    .steps {
        font: inherit;
        font-family: Verdana, Geneva, sans-serif;
        padding: 6px 8px;
        border-radius: 3px;
        border: 1px solid #475569;
        background: #FFFFFF;
        color: #1E293B;
        min-width: 120px;
    }

    .note {
        font-size: 12px;
        color: #475569;
        line-height: 1.6;
        max-width: 84ch;
        margin: 8px 0 0 0;
    }

    .role {
        font-size: 12px;
        color: #475569;
        line-height: 1.6;
        max-width: 84ch;
        margin: 0 0 8px 0;
    }

    a { color: #01689B; }
    a:hover { color: #154273; }

    @media (max-width: 720px) {
        body { margin: 12px; }
        .palette { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
        .palette.ramp { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .color-box { height: 88px; }
        .controls { align-items: flex-start; flex-direction: column; }
    }
</style>
</head>

<body>
<h1>ROOS Kleurenkiezer</h1>
<p class="subtitle">Alle kleurtokens van het RVO Open Ontwerp Systeem, inclusief de volledige
tintenreeks per kleur — ook de tinten die dit dashboardsysteem zelf niet gebruikt. Elke tint is
een gedefinieerd token, geen gemengd percentage. Klik een vlak om de hexwaarde te kopiëren.</p>
<div id="palette-root"></div>

<script>
// ============================================================
// ROOS-KLEURTOKENS
// Bron: nl-design-system.github.io/rvo/docs — bijlage B van dit
// ontwerpsysteem. Elke kleur heeft vijf tinten (150 lichtst tot
// 750 donkerst) plus de basiskleur op volle sterkte.
// ============================================================

// Volgorde in elke reeks: 150 · 300 · 450 · 600 · 750 · base
const RAMPS = {
  Lintblauw:   ['#DCE3EA','#B9C7D5','#95AAC0','#738EAB','#507196','#154273'],
  Violet:      ['#F2D9E7','#E5B2CF','#D88CB7','#CB66A0','#BE4088','#A90061'],
  Lichtblauw:  ['#EEF7FC','#DEF0F8','#CCE7F4','#BCDFF1','#ABD7ED','#8FCAE7'],
  Hemelblauw:  ['#D9EBF7','#B3D7EE','#8CC4E6','#66B0DD','#409CD5','#007BC7'],
  Donkerblauw: ['#D9E9F0','#B3D2E1','#8CBBD2','#67A4C3','#418EB4','#01689B'],
  Oranje:      ['#FBEAD9','#F6D4B3','#F1BF8C','#EDA966','#E89440','#E17000'],
  Groen:       ['#E2EDDB','#C4DBB7','#A6C991','#88B76D','#6BA549','#39870C'],
  Donkergeel:  ['#FFF4DB','#FFE9B8','#FFDE94','#FFD371','#FFC84D','#FFB612'],
  Rood:        ['#F9DFDD','#F3C0BC','#EC9F99','#E68078','#E06056','#D51B1E']
};

const TINT_LABELS = ['150','300','450','600','750','base'];

const RAMP_GROUPS = [
  { name:'Concern', colours:['Lintblauw','Violet','Lichtblauw'] },
  { name:'Functioneel', colours:['Hemelblauw','Donkerblauw'] },
  { name:'Signaal', colours:['Oranje','Groen','Donkergeel','Rood'] }
];

// Grijstrap: blauw getint (slate), geen neutraal grijs
const GRIJS = [
  { name:'Grijs-050', value:'#F8FAFC' },
  { name:'Grijs-100', value:'#F1F5F9' },
  { name:'Grijs-200', value:'#E2E8F0' },
  { name:'Grijs-300', value:'#CBD5E1' },
  { name:'Grijs-400', value:'#94A3B8' },
  { name:'Grijs-500', value:'#64748B' },
  { name:'Grijs-600', value:'#475569' },
  { name:'Grijs-700', value:'#334155' },
  { name:'Grijs-800', value:'#1E293B' },
  { name:'Grijs-900', value:'#0F172A' },
  { name:'Zwart', value:'#000000' },
  { name:'Wit', value:'#FFFFFF' }
];

// Het reekspalet van het thema: zeven datakleuren plus een grijs
const REEKSPALET = [
  { name:'Hemelblauw', value:'#007BC7' },
  { name:'Oranje-750', value:'#E89440' },
  { name:'Violet-600', value:'#CB66A0' },
  { name:'Groen-750', value:'#6BA549' },
  { name:'Donkergeel-450', value:'#FFDE94' },
  { name:'Rood-750', value:'#E06056' },
  { name:'Lichtblauw', value:'#8FCAE7' },
  { name:'Grijs-400', value:'#94A3B8' }
];

const STATUS = [
  { name:'Groen', value:'#39870C' },
  { name:'Donkergeel', value:'#FFB612' },
  { name:'Rood', value:'#D51B1E' },
  { name:'Grijs-400', value:'#94A3B8' }
];

const STRUCTUUR = [
  { name:'Lintblauw', value:'#154273' },
  { name:'Hemelblauw', value:'#007BC7' },
  { name:'Donkerblauw', value:'#01689B' },
  { name:'Grijs-100', value:'#F1F5F9' },
  { name:'Grijs-300', value:'#CBD5E1' },
  { name:'Grijs-600', value:'#475569' },
  { name:'Grijs-800', value:'#1E293B' },
  { name:'Wit', value:'#FFFFFF' }
];

// ============================================================
// STAAT
// ============================================================

let singleColour = 'Hemelblauw', singleSteps = 6;
let divergingLeft = 'Rood', divergingRight = 'Groen', divergingSteps = 7;
let divergingCentre = 'Grijs-100';

const CENTRES = {
  'Grijs-100': '#F1F5F9',
  'Grijs-050': '#F8FAFC',
  'Wit': '#FFFFFF'
};

// ============================================================
// HULP
// ============================================================

const clamp = (n,min,max) => Math.max(min, Math.min(max, n));

function luminance(hex){
  const toLinear = c => { const s = c/255; return s <= .03928 ? s/12.92 : Math.pow((s+.055)/1.055, 2.4); };
  return .2126*toLinear(parseInt(hex.slice(1,3),16))
       + .7152*toLinear(parseInt(hex.slice(3,5),16))
       + .0722*toLinear(parseInt(hex.slice(5,7),16));
}

function ratio(a, b){
  const la = luminance(a), lb = luminance(b);
  return (Math.max(la,lb) + .05) / (Math.min(la,lb) + .05);
}

// Neem van Grijs-800 en Wit de kleur met het hoogste contrast, niet een
// helderheidsdrempel: de middentinten liggen er precies tussenin.
function contrastColor(hex){
  return ratio('#1E293B', hex) >= ratio('#FFFFFF', hex) ? '#1E293B' : '#FFFFFF';
}

// Gelijkmatige greep uit een reeks indices, uiteinden altijd mee
function evenSample(indices, n){
  n = clamp(n, 1, indices.length);
  if(n === 1) return [indices[indices.length-1]];
  const out = [];
  for(let k = 0; k < n; k++){
    out.push(indices[Math.round(k * (indices.length - 1) / (n - 1))]);
  }
  return out;
}

function tintName(colour, i){
  return TINT_LABELS[i] === 'base' ? colour : `${colour}-${TINT_LABELS[i]}`;
}

// Sequentieel: licht naar donker, uit de eigen tintenreeks
function generateSingleRamp(colour, steps){
  const ramp = RAMPS[colour];
  return evenSample([0,1,2,3,4,5], steps)
    .map(i => ({ name: tintName(colour, i), value: ramp[i] }));
}

// Divergerend: twee tintenreeksen om een neutraal midden heen.
// Per zijde uit 300…base, zodat het midden het lichtste punt blijft.
function generateDivergingRamp(left, right, steps){
  let n = steps % 2 ? steps : steps - 1;
  n = clamp(n, 3, 11);
  const perSide = (n - 1) / 2;
  const idx = evenSample([1,2,3,4,5], perSide);

  const leftSide = idx.map(i => ({ name: tintName(left, i), value: RAMPS[left][i] })).reverse();
  const rightSide = idx.map(i => ({ name: tintName(right, i), value: RAMPS[right][i] }));

  return [
    ...leftSide,
    { name: divergingCentre, value: CENTRES[divergingCentre] },
    ...rightSide
  ];
}

// ============================================================
// UI
// ============================================================

function createEl(tag, props = {}, children = []){
  const el = document.createElement(tag);
  Object.assign(el, props);
  children.forEach(c => el.appendChild(c));
  return el;
}

function createColorBox(c){
  const box = createEl('button', { className:'color-box', type:'button' });
  box.style.setProperty('--box-color', c.value);

  const caption = createEl('div', { className:'caption' });
  caption.style.color = contrastColor(c.value);
  caption.innerHTML = `<strong>${c.name}</strong>${c.value}`;

  const toast = createEl('div', { className:'copied', textContent:'Gekopieerd' });

  box.onclick = () => {
    navigator.clipboard.writeText(c.value).then(() => {
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 900);
    });
  };

  box.append(caption, toast);
  return box;
}

function renderPaletteGroup(parent, group){
  const article = createEl('article', { className:'palette-group' });
  article.appendChild(createEl('h3', { textContent: group.name }));
  if(group.note) article.appendChild(createEl('p', { className:'role', textContent: group.note }));

  const grid = createEl('div', { className: group.ramp ? 'palette ramp' : 'palette' });
  group.colors.forEach(c => grid.appendChild(createColorBox(c)));
  article.appendChild(grid);
  parent.appendChild(article);
}

function createSelect(values, current, onChange){
  const sel = createEl('select', { className:'steps' });
  values.forEach(v => {
    const opt = createEl('option', { value:v, textContent:v });
    if(String(v) === String(current)) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = e => onChange(e.target.value);
  return sel;
}

function renderSingleControls(section){
  const ctrl = createEl('div', { className:'controls' });
  ctrl.append(
    createEl('label', { textContent:'Kleur' }),
    createSelect(Object.keys(RAMPS), singleColour, v => { singleColour = v; render(); }),
    createEl('label', { textContent:'Stappen' }),
    createSelect([2,3,4,5,6], singleSteps, v => { singleSteps = parseInt(v,10); render(); })
  );
  section.appendChild(ctrl);
}

function renderDivergingControls(section){
  const names = Object.keys(RAMPS);
  const ctrl = createEl('div', { className:'controls' });
  ctrl.append(
    createEl('label', { textContent:'Kleur 1' }),
    createSelect(names, divergingLeft, v => { divergingLeft = v; render(); }),
    createEl('label', { textContent:'Midden' }),
    createSelect(Object.keys(CENTRES), divergingCentre, v => { divergingCentre = v; render(); }),
    createEl('label', { textContent:'Kleur 2' }),
    createSelect(names, divergingRight, v => { divergingRight = v; render(); }),
    createEl('label', { textContent:'Stappen' }),
    createSelect([3,5,7,9,11], divergingSteps, v => { divergingSteps = parseInt(v,10); render(); })
  );
  section.appendChild(ctrl);
}

// ============================================================
// SECTIES
// ============================================================

function rampGroups(){
  const groups = [];
  RAMP_GROUPS.forEach(g => {
    g.colours.forEach(colour => {
      groups.push({
        name: colour,
        ramp: true,
        colors: RAMPS[colour].map((v,i) => ({ name: tintName(colour, i), value: v }))
      });
    });
  });
  return groups;
}

function buildSections(){
  return [
    {
      title:'Wat dit dashboardsysteem gebruikt',
      groups:[
        { name:'Reekspalet — de acht datakleuren, in deze volgorde',
          note:'Reeks 1 is Hemelblauw, de primaire kleur van ROOS. Reeks 8 is Grijs-400 en betekent altijd "overig" of "vorige periode", nooit een gewone categorie.',
          colors: REEKSPALET },
        { name:'Status',
          note:'Groen, Donkergeel en Rood op volle sterkte zijn status en geen reekskleur. Donkergeel haalt AA niet met witte tekst — daar hoort Grijs-800 of Zwart op.',
          colors: STATUS },
        { name:'Structuur en tekst',
          note:'Lintblauw alleen voor kopbalk en tabelkop. Hemelblauw voor alles wat interactief is. Grijs-600 voor ondergeschikte tekst, Grijs-800 voor lopende tekst.',
          colors: STRUCTUUR }
      ]
    },
    {
      title:'Alle tintenreeksen',
      intro:'Negen kleuren × zes tinten. Dit zijn gedefinieerde tokens, niet gemengde percentages: neem een tint over zoals hij hier staat en meng zelf niets bij. De reeksen lopen links licht naar rechts vol.',
      groups: rampGroups()
    },
    {
      title:'Grijstrap',
      intro:'Twaalf tokens. De ROOS-grijzen zijn blauw getint (slate) en niet neutraal — meng ze niet met een neutraal grijs in hetzelfde rapport.',
      groups:[{ name:'Grijs-050 tot Grijs-900, plus Zwart en Wit', colors: GRIJS }]
    },
    {
      title:'Sequentiële schaal',
      intro:'Eén kleur, licht naar donker, voor een geordende grootheid: een heatmap, gegevensbalken, een gevulde kaart.',
      controls:'single',
      groups:[{
        name:`${singleColour} · ${singleSteps} stappen`,
        ramp: singleSteps === 6,
        colors: generateSingleRamp(singleColour, singleSteps)
      }]
    },
    {
      title:'Divergerende schaal',
      intro:'Twee kleuren om een neutraal midden, voor een grootheid met een nulpunt: afwijking van streefwaarde, verandering ten opzichte van vorige periode.',
      controls:'div',
      groups:[{
        name:`${divergingLeft} – ${divergingCentre} – ${divergingRight} · ${divergingSteps} stappen`,
        colors: generateDivergingRamp(divergingLeft, divergingRight, divergingSteps)
      }]
    }
  ];
}

function render(){
  const root = document.getElementById('palette-root');
  root.innerHTML = '';

  buildSections().forEach(sec => {
    const section = createEl('section', { className:'palette-section' });
    section.appendChild(createEl('h2', { textContent: sec.title }));
    if(sec.intro) section.appendChild(createEl('p', { className:'note', textContent: sec.intro }));

    if(sec.controls === 'single') renderSingleControls(section);
    if(sec.controls === 'div') renderDivergingControls(section);

    sec.groups.forEach(g => renderPaletteGroup(section, g));
    root.appendChild(section);
  });
}

render();
</script>

</body>
</html>
